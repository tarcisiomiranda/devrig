min_version = "2026.7.0"

# Precompiled CPython (astral python-build-standalone). Without this, mise may
# fall back to python-build and produce a broken interpreter on GitHub Actions
# (missing _bz2 / readline / _lzma when libbz2-dev is not installed).
[settings]
python.compile = false

[tools]
go = "1.25"
# 3.12 has reliable precompiled builds on linux/darwin; 3.13.x recently fell
# through to source compile on ubuntu-latest and broke extension modules.
python = "3.12"
shellcheck = "0.11"

[tasks.build]
description = "Build devrig into ./bin/devrig"
run = """
set -eu
mkdir -p bin
go build -trimpath -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty)" -o bin/devrig .
"""

[tasks.install]
description = "Install devrig to ~/.local/bin (plus the testpg compatibility link)"
run = """
set -eu
mkdir -p bin "$HOME/.local/bin"
go build -trimpath -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty)" -o bin/devrig .
install -m 755 bin/devrig "$HOME/.local/bin/devrig"
ln -sf "$HOME/.local/bin/devrig" "$HOME/.local/bin/testpg"
echo "installed: $HOME/.local/bin/devrig (testpg -> devrig)"
"$HOME/.local/bin/devrig" version
"""

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks."test:integration"]
description = "Run integration tests (requires Docker)"
run = "go test -tags=integration ./... -count=1"

[tasks.check]
description = "Format check, vet and unit tests"
run = """
set -eu
test -z "$(gofmt -l .)" || { echo 'gofmt needed:'; gofmt -l .; exit 1; }
go vet ./...
go test ./...
"""

[tasks.clean]
description = "Remove generated binaries"
run = "rm -rf bin dist release"

[tasks."release:dry"]
description = "Cross-compile every release target into ./dist (no publishing)"
run = """
set -eu
rm -rf dist && mkdir -p dist
version="$(git describe --tags --always --dirty)"
for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
  goos="${target%/*}"; goarch="${target#*/}"
  CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
    go build -trimpath -ldflags "-s -w -X main.version=${version}" \
    -o "dist/devrig_${goos}_${goarch}" .
  echo "built dist/devrig_${goos}_${goarch}"
done
ls -lh dist
"""

[tasks."release:check"]
description = "Validate the GitHub release script"
run = "python -m py_compile .github/scripts/release.py .github/scripts/test_release.py && python -m unittest discover -s .github/scripts -p 'test_*.py' && python .github/scripts/release.py --validate-tag v0.0.0"

[tasks."lint:shell"]
description = "Lint shell scripts"
run = "shellcheck install.sh scripts/*.sh"

[tasks."test:installer"]
description = "Test the release installer without network access"
run = "scripts/test-installer.sh"
