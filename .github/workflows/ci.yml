name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MISE_PYTHON_COMPILE: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        uses: jdx/mise-action@v4
        with:
          install_args: "go python shellcheck"
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - run: mise exec -- go vet ./...
      - run: mise run test

      # The release builds these four; a broken cross-compile should fail here,
      # not when someone is cutting a tag.
      - name: Cross-compile release targets
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS="${t%/*}" GOARCH="${t#*/}" \
              mise exec -- go build -trimpath -o "dist/devrig_${t%/*}_${t#*/}" .
            echo "ok $t"
          done

      - name: Test release publisher
        run: mise run release:check

      - name: Lint shell scripts
        run: mise run lint:shell

      - name: Test installer
        run: mise run test:installer
