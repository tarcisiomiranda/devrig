name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go test ./... -count=1

      # The release builds these four; a broken cross-compile should fail here,
      # not when someone is cutting a tag.
      - name: Cross-compile release targets
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS="${t%/*}" GOARCH="${t#*/}" \
              go build -trimpath -o /dev/null .
            echo "ok $t"
          done

      - name: Shell check install.sh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          bash -n install.sh
          shellcheck install.sh
