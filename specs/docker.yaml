decisions:
  - what: Readiness requires a real query, not just a TCP accept.
    why: Postgres binds the port before finishing initialisation, so connecting on first accept fails with "the database system is starting up".
    path: internal/wait/wait.go
  - what: publishedPort takes the container port as an argument instead of assuming 5432.
    why: It read NetworkSettings.Ports["5432/tcp"] while the container was created from the engine spec's port, so any engine off 5432 would have been created correctly and then reported as "not published" by up, status, url, list and logs.
    path: internal/docker/client.go
  - what: An overridden container port that never answers gets an explicit hint.
    why: --container-port on a stock image produces a readiness timeout that looks like a broken database rather than a misconfigured port.
    path: internal/docker/client.go
  - what: Docker is one implementation of rig.Backend, not the CLI's only path.
    why: The Kubernetes backend answers the same calls, so cmd depends on the
      interface and every status names the backend it came from.
    path: internal/docker/client.go, internal/rig/rig.go
  - what: A missing instance returns rig.NotFoundError.
    why: Auto mode has to tell "not here" from "Docker is broken" before it
      looks for the same instance on the cluster.
    path: internal/docker/client.go
  - what: Managed containers are discovered with two label queries instead of one.
    why: Docker ANDs the terms in a filter set, so current and legacy label sets cannot be matched in a single call.
    path: internal/docker/client.go
