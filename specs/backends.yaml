domain: backends
description: The Backend contract shared by Docker and Kubernetes, and how one is chosen.

models:
  - name: Kind
    path: internal/rig/rig.go
  - name: Status / DownResult / LogsResult / UpOptions
    path: internal/rig/rig.go
  - name: Backend
    path: internal/rig/rig.go
  - name: NotFoundError / IsNotFound
    path: internal/rig/rig.go
  - name: autoBackend
    path: cmd/auto.go
  - name: resolveKind / selectBackend / kubeOptions
    path: cmd/backend.go

