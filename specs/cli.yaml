decisions:
  - what: --timeout defaults to 0, meaning "whatever the backend says".
    why: 30s is right for a local container and wrong for a pod on a cold node;
      one printed default would have to be wrong for one of the two.
    path: cmd/root.go, internal/kube/client.go
  - what: Backend flags are persistent, not per-command.
    why: down/status/url/logs/list all need to address the same cluster, and a
      flag that only existed on up would strand every follow-up command.
    path: cmd/backend.go
  - what: up takes the resource first, with the instance in --name (v0.2.0).
    why: A multi-resource tool reads as `up postgres --name x`; the old shape only made sense while Postgres was the only option.
    path: cmd/root.go
  - what: The removed --engine flag stays registered and hidden.
    why: Cobra would answer "unknown flag"; keeping it lets the CLI print the exact replacement command during migration.
    path: cmd/root.go
  - what: --port and --container-port are separate flags, host side and container side.
    why: One flag cannot mean both; the host port is what callers connect to, the container port is what the image listens on, and only the second one has to match the engine.
    path: cmd/root.go, internal/docker/client.go
  - what: Execute prints cobra-level errors before returning.
    why: With SilenceErrors and no handler, unknown flags and bad argument counts produced no output at all, only exit 1.
    path: cmd/root.go
  - what: --tool is a per-command flag on build/push/login, not persistent.
    why: It means nothing to up/down/url; a persistent flag would suggest the
      instance backend could be "podman".
    path: cmd/image.go
  - what: --env-file defaults to ./.env only when that file exists; an explicit path must exist.
    why: A project without a .env must push with the tool's own session and no
      error, while a typo in --env-file must not be silently ignored.
    path: cmd/image.go
