  - name: --namespace / -n (persistent, kube)
    path: cmd/backend.go
  - name: --context (persistent, kube)
    path: cmd/backend.go
  - name: --kubeconfig (persistent, kube)
    path: cmd/backend.go
  - name: --all-namespaces / -A (list, kube)
    path: cmd/backend.go
  - name: --cpu / --memory (up, kube)
    path: cmd/backend.go
  - name: --tool (build, push, login)
    path: cmd/image.go
  - name: --env-file (build, push, login)
