domain: cli
description: Cobra commands, flags, version wiring and JSON/URL output.
# up takes the resource first since v0.2.0: `up <resource> [--name]`.

models: []

graphql:
  queries: []
  mutations: []

rest:
  endpoints: []

frontend:
  pages: []
  hooks: []
  components: []
  types: []

commands:
  - name: devrig
    path: cmd/root.go
  - name: up <resource>
    path: cmd/root.go
  - name: down
    path: cmd/root.go
  - name: status
    path: cmd/root.go
  - name: list
    path: cmd/root.go
  - name: url
    path: cmd/root.go
  - name: logs
    path: cmd/root.go
  - name: version
    path: cmd/root.go

flags:
  - name: --port
    path: cmd/root.go
  - name: --name
    path: cmd/root.go
  # --engine removed in v0.2.0; kept hidden only to print a migration error.
  - name: --engine (removed, hidden)
    path: cmd/root.go
  - name: --user
    path: cmd/root.go
  - name: --password
    path: cmd/root.go
  - name: --db
    path: cmd/root.go
  - name: --image
    path: cmd/root.go
  - name: --timeout
    path: cmd/root.go
  - name: --tail
    path: cmd/root.go

types:
  - name: version (ldflags main.version)
    path: main.go
  - name: JSON / Fatal helpers
    path: internal/out/out.go

decisions:
  - what: up takes the resource first, with the instance in --name (v0.2.0).
    why: A multi-resource tool reads as `up postgres --name x`; the old shape only made sense while Postgres was the only option.
    path: cmd/root.go
  - what: The removed --engine flag stays registered and hidden.
    why: Cobra would answer "unknown flag"; keeping it lets the CLI print the exact replacement command during migration.
    path: cmd/root.go
  - what: Execute prints cobra-level errors before returning.
    why: With SilenceErrors and no handler, unknown flags and bad argument counts produced no output at all, only exit 1.
    path: cmd/root.go
