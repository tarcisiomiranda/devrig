  - name: --port
    path: cmd/root.go
  - name: --container-port
    path: cmd/root.go
  - name: --name
    path: cmd/root.go
  # --engine removed in v0.2.0; kept hidden only to print a migration error.
  - name: --engine (removed, hidden)
    path: cmd/root.go
  - name: --user
    path: cmd/root.go
  - name: --password
    path: cmd/root.go
  - name: --db
    path: cmd/root.go
  - name: --image
    path: cmd/root.go
  - name: --timeout
    path: cmd/root.go
  - name: --tail
    path: cmd/root.go
  - name: --backend (persistent)
