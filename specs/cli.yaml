domain: cli
description: Cobra commands, flags, version wiring and JSON/URL output.
# up takes the resource first since v0.2.0: `up <resource> [--name]`.

models: []

graphql:
  queries: []
  mutations: []

rest:
  endpoints: []

frontend:
  pages: []
  hooks: []
  components: []
  types: []

commands:
  - name: devrig
    path: cmd/root.go
  - name: up <resource>
    path: cmd/root.go
  - name: down
    path: cmd/root.go
  - name: status
    path: cmd/root.go
  - name: list
    path: cmd/root.go
  - name: url
    path: cmd/root.go
  - name: logs
    path: cmd/root.go
  - name: version
    path: cmd/root.go
  - name: build [context]
    path: cmd/image.go
  - name: push <image>...
    path: cmd/image.go
  - name: login [registry]
    path: cmd/image.go

