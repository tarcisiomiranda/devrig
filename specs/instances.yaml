decisions:
  - what: Pod names go through SanitizeForDNS, not SanitizeForDB.
    why: >-
      The database sanitiser maps dashes to underscores, which Kubernetes
      rejects; a pod name has to be a DNS-1123 label (lowercase, no underscore).
    path: internal/instance/name.go
  - what: The same devrig.* keys are labels on containers and split across
      labels and annotations on pods.
    why: Kubernetes label values cannot hold a password or an image reference,
      so only the selectable identity (managed, name, engine) stays a label.
    path: internal/instance/name.go, internal/kube/manifest.go
  - what: Legacy cyber.testpg.* labels are read, never guessed from current defaults.
    why: The old build stored its own database name; deriving it from the instance name hands out a URL pointing at a database that does not exist.
    path: internal/instance/name.go, internal/docker/client.go
  - what: The container port is stored in the devrig.container_port label.
    why: status/url read a container back from its labels; re-deriving the port from the engine spec would contradict a --container-port override and find no binding. Containers without the label fall back to the engine default, which keeps legacy testpg ones working.
    path: internal/instance/name.go, internal/docker/client.go
  - what: Sanitized identifiers are capped at 48 characters.
    why: Postgres caps identifiers at 63 bytes and MySQL at 64; the cap leaves room for the _test suffix.
    path: internal/instance/name.go
